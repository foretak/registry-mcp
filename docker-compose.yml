services:
  api:
    build: .
    image: registry-mcp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REGISTRY_MCP_CACHE_PATH: /app/data/cache.sqlite3
    volumes:
      - registry-data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  registry-data:
  caddy-data:
  caddy-config:
