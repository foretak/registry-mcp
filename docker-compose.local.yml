# Optional override for local testing on a machine where ports 80/443 are
# already taken (or unavailable to Docker). Not loaded by default — pass it
# explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
#
# Maps Caddy's HTTP/HTTPS to 8080/8443 instead of 80/443. TLS still works:
# with REGISTRY_MCP_DOMAIN=localhost, Caddy serves the internal-CA
# certificate on whatever port 443 is mapped to — just add the port to the
# URL: `curl -k https://localhost:8443/health`. See "Smoke test" in
# deploy.md for the full command set with this override active.
services:
  caddy:
    ports: !override
      - "8080:80"
      - "8443:443"
