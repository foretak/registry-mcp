[project]
name = "registry-mcp"
version = "0.1.0"
description = "Company data for AI agents, any country. MCP server and REST API over national business registries — first module: Norway (Brønnøysundregistrene / Enhetsregisteret, organisasjonsnummer / orgnr lookup)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kim" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "company-data",
    "business-registry",
    "brreg",
    "bronnoysund",
    "brønnøysundregistrene",
    "enhetsregisteret",
    "organisasjonsnummer",
    "orgnr",
    "norway",
    "norwegian-business-registry",
    "company-lookup",
    "vat",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/foretak/registry-mcp"
Repository = "https://github.com/foretak/registry-mcp"
Issues = "https://github.com/foretak/registry-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

# NOTE (T07 owns this): console scripts for the stdio server land here.
#   [project.scripts]
#   registry-mcp = "registry_mcp.mcp.stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry_mcp"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode in strings: Norwegian/typographic text is expected here
    "RUF002",  # ...same, in docstrings
    "RUF003",  # ...same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["registry_mcp", "tests"]
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "respx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/registry_mcp"]
