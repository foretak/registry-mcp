[project]
name = "registry-mcp"
version = "0.2.0"
description = "The company registry MCP: company data for AI agents, any country. MCP server and REST API over national business registries — first module: Norway (brreg / Brønnøysundregistrene / Enhetsregisteret, company lookup by organisasjonsnummer, orgnr or org.nr)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kim" }]
keywords = [
    # Protocol and product (country-neutral umbrella — KEYWORDS.md §1)
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "company-data",
    "company-registry",
    "company-lookup",
    "business-registry",
    # Norway — accented forms for readers
    "brreg",
    "brønnøysund",
    "brønnøysundregistrene",
    "enhetsregisteret",
    "organisasjonsnummer",
    "orgnr",
    "org.nr",
    "foretak",
    # Norway — ASCII fallbacks for indexes that fold or reject diacritics
    "bronnoysund",
    "bronnoysundregistrene",
    "norway",
    "norway-company-lookup",
    "norwegian-business-registry",
    "vat",
    "mva",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Norwegian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0,<5",
]

[project.urls]
Homepage = "https://api.foretak.dev"
Documentation = "https://api.foretak.dev/llms-full.txt"
Repository = "https://github.com/foretak/registry-mcp"
Issues = "https://github.com/foretak/registry-mcp/issues"
Changelog = "https://github.com/foretak/registry-mcp/releases"
"REST API" = "https://api.foretak.dev/openapi.json"
"MCP endpoint" = "https://api.foretak.dev/mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
registry-mcp = "registry_mcp.mcp.server:main"

[dependency-groups]
# `evals/run.py --agent` only. Deliberately not a runtime dependency and not
# in `[project.optional-dependencies]`: `uv sync --all-extras --locked` (CI,
# and every other `uv sync`) never installs it. Run `uv run --group eval
# python evals/run.py --agent` to get it. See `evals/README.md`.
eval = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry_mcp"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode in strings: Norwegian/typographic text is expected here
    "RUF002",  # ...same, in docstrings
    "RUF003",  # ...same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["registry_mcp", "tests"]
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "respx.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "live: hits the real upstream registry over the network; excluded from CI with -m 'not live'",
]

[tool.coverage.run]
source = ["src/registry_mcp"]
